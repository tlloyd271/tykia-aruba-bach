<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tykia's Bachelorette · Aruba</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Dancing+Script:wght@400;600;700&family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@0,300;0,600;1,300;1,600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }

body {
  background: #0a0a0a;
  font-family: 'Cormorant Garamond', Georgia, serif;
  color: #fff;
  overflow-x: hidden;
}

/* ── HERO ── */
.hero {
  position: relative;
  width: 100%;
  height: 100vh;
  min-height: 640px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.hero-bg {
  position: absolute;
  inset: 0;
}
.hero-bg img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 35%;
}
.hero-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(
    to bottom,
    rgba(0,0,0,0.45) 0%,
    rgba(0,0,0,0.2)  30%,
    rgba(0,0,0,0.65) 65%,
    rgba(0,0,0,0.96) 100%
  );
}

.hero-content {
  position: relative;
  z-index: 2;
  text-align: center;
  padding: 0 28px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.eyebrow {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 11px;
  letter-spacing: .55em;
  color: rgba(201,169,110,0.65);
  margin-bottom: 18px;
}

.hero-script {
  font-family: 'Dancing Script', cursive;
  font-weight: 700;
  font-size: clamp(64px, 14vw, 130px);
  color: #fff;
  line-height: 0.88;
  text-shadow: 0 6px 50px rgba(0,0,0,0.9);
}

.hero-script.gold { color: #c9a96e; }

.hero-serif {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: clamp(16px, 3.5vw, 28px);
  color: rgba(255,255,255,0.55);
  letter-spacing: .1em;
  margin-top: 10px;
}

.divider {
  display: flex;
  align-items: center;
  gap: 14px;
  margin: 22px auto;
}
.divider-line {
  width: 44px;
  height: 1px;
  background: rgba(201,169,110,0.35);
}
.divider-star {
  font-size: 11px;
  color: rgba(201,169,110,0.5);
}

.hero-date {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 11px;
  letter-spacing: .45em;
  color: rgba(255,255,255,0.3);
  margin-bottom: 44px;
}

/* ── CARDS ── */
.cards {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  justify-content: center;
}

.card {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 195px;
  padding: 26px 22px;
  border: 1px solid rgba(201,169,110,0.25);
  background: rgba(0,0,0,0.55);
  backdrop-filter: blur(16px);
  text-decoration: none;
  cursor: pointer;
  transition: all .35s ease;
  text-align: center;
}
.card::before {
  content: '';
  position: absolute;
  inset: 3px;
  border: 0.5px solid rgba(201,169,110,0.1);
  pointer-events: none;
  transition: border-color .35s;
}

.card:hover {
  background: rgba(201,169,110,0.1);
  border-color: rgba(201,169,110,0.6);
  transform: translateY(-4px);
  box-shadow: 0 16px 50px rgba(0,0,0,0.6);
}
.card:hover::before {
  border-color: rgba(201,169,110,0.25);
}

.card-glyph {
  font-size: 20px;
  color: rgba(201,169,110,0.6);
  line-height: 1;
  margin-bottom: 2px;
}

.card-label {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 14px;
  letter-spacing: .28em;
  color: rgba(255,255,255,0.9);
}

.card-sub {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 13px;
  color: rgba(201,169,110,0.6);
  line-height: 1.3;
}

/* ── SCROLL HINT ── */
.scroll-hint {
  position: absolute;
  bottom: 26px;
  left: 0;
  right: 0;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}
.scroll-hint-text {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 9px;
  letter-spacing: .5em;
  color: rgba(255,255,255,0.18);
}
.scroll-arrow {
  width: 1px;
  height: 28px;
  background: linear-gradient(to bottom, rgba(201,169,110,0.4), transparent);
  animation: pulse-down 2s ease-in-out infinite;
}
@keyframes pulse-down {
  0%, 100% { opacity: 0.4; transform: scaleY(1); }
  50% { opacity: 1; transform: scaleY(1.15); }
}

@media (max-width: 480px) {
  .cards { flex-direction: column; align-items: center; }
  .card { width: 250px; }
}
</style>
</head>
<body>

<section class="hero">
  <div class="hero-bg">
    <img src="pics/tyk.JPG" alt="Tykia">
  </div>
  <div class="hero-overlay"></div>

  <div class="hero-content">
    <div class="eyebrow">✦ &nbsp; Aruba &nbsp; ✦</div>
    <div class="hero-script">Tykia's</div>
    <div class="hero-script gold">Bachelorette</div>
    <div class="hero-serif">She Said Yes</div>

    <div class="divider">
      <div class="divider-line"></div>
      <div class="divider-star">✦</div>
      <div class="divider-line"></div>
    </div>

    <div class="hero-date">Summer 2025</div>

    <div class="cards">
      <a class="card" href="themes.html">
        <div class="card-glyph">✦</div>
        <div class="card-label">Theme Guide</div>
        <div class="card-sub">Outfits & Inspo<br>for Every Night</div>
      </a>
      <a class="card" href="itinerary.html">
        <div class="card-glyph">◆</div>
        <div class="card-label">Trip Itinerary</div>
        <div class="card-sub">Day-by-Day Plans<br>& All the Details</div>
      </a>
    </div>
  </div>

  <div class="scroll-hint">
    <div class="scroll-hint-text">explore</div>
    <div class="scroll-arrow"></div>
  </div>
</section>

</body>
</html>
